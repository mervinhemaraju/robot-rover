to_buy:
  - item: Solder wire, rosin core (~0.8mm)
    qty: 1 roll
    source: local (Advanced M or similar) - to be bought before DRV8871s arrive
    notes: Needed to attach the DRV8871 headers/screw terminals if they arrive
      unsoldered (5-pack photos suggest they will).
      60/40 leaded is easiest for a beginner; lead-free needs more heat.

  - item: Resistor, 10k ohm
    qty: ~10
    source: local (Advanced M) - same errand as the solder wire
    notes: First check the 5 unconfirmed resistors already owned (color bands
      or DM850 resistance mode) - only buy what's missing. Two are for the
      battery telemetry voltage divider (halves 8.4V max to 4.2V, safe for the
      Arduino's 5V analog pin, Phase 3), four as photo interrupter pull-ups
      (Phase 4). Dirt cheap, buy spares.

in_transit:
  - item: DRV8871 motor driver module
    qty: 5
    spare: 3
    source: AliExpress (DIY NOW 5-pack, MUR 273.25)
    ordered: 2026-07-09
    notes: >-
      MOSFET replacement for L298N (near-zero voltage drop, ~25-30% speed gain,
      confirmed by DM850 test showing 1.73V lost in the L298N). Single-channel,
      so 2 in use (one per motor side) + 3 spares. Up to ~3.6A with built-in
      current limiting - ample stall headroom for 2 TT motors per board. Screw
      terminals for motor + power wires; logic via header pins. Listing photos
      show terminals and headers loose (exploded kit view), so expect to solder
      them on arrival (beginner-level through-hole job, iron on hand).
      Gotcha: minimum supply is 6.5V, so a deeply sagged 2S pack will
      trip undervoltage lockout (recharge point). Motors stay limited to 2S
      (7.4V) - the driver tolerates more but the TT motors max out at 9V.

