  - item: 5V buck converter (second, for servos)
    qty: 1
    source: local (Advanced M)
    status: in_use
    notes: >-
      Dedicated supply for the SG90s from the 7.4V pack, keeps servo current
      spikes off the Pi's buck (Pi has undervoltage history). Servos must NEVER
      be powered from the Arduino/ESP32 5V pin. Common ground with the MCU is
      required - without it the servos twitch or sit dead even when every other
      wire is correct. Set and verified at 5.0V with the DM850 before the servos
      were connected; always adjust with the output disconnected, and trust the
      meter over the module's own display.
      In use since 2026-07-25 for the Phase 5 pan-tilt bench test.

  - item: Pi Camera CSI ribbon cable, 30cm
    qty: 1
    source: AliExpress
    status: received
    notes: Standard 15-pin 1mm-pitch CSI ribbon for Pi 3B + Camera v2 (not the
      narrow 22-pin Pi Zero type). Replaces the stock ~15cm ribbon so the
      camera can pan/tilt without strain. For Phase 5 pan-tilt mount. Not yet
      installed - camera still on stock ribbon.

  - item: Pan-tilt kit with 2x SG90 servos (combined)
    qty: 1
    source: AliExpress (MUR 418.52, "PTZ with 2 servo" variant)
    status: in_use
    notes: >-
      Covers both the "SG90 servo motor x2" and "Pan-tilt bracket" deferred
      items for Phase 5. Kit form - nylon bracket + screws + 2 blue 9g SG90s,
      screwdriver assembly only. Camera v2 attaches to top plate via zip tie or
      velcro (hole pattern won't match). Servos are for pan-tilt only; arms will
      need MG996R or similar later.
      ASSEMBLED and bench-tested 2026-07-25 - both servos confirmed sweeping
      45-135 deg. Wire colours on this kit are red=5V, brown=GND, YELLOW=signal
      (not orange as on some SG90s). Pan = bottom servo (rotates the whole
      assembly); tilt = top servo (tips the camera plate). Colours are identical
      on both servos, so identify them by physical position, not by wire.
      On the R4 Minima - pan signal D10, tilt signal D11 (both free; the motor
      sketch uses 4,5,6,7,8,9), stock Servo.h library, servo cable connectors are
      female so M-M jumpers are needed to reach the Arduino headers.
      Start narrow at 45-135 deg: the bracket hits its own frame before 0/180 and
      a stalled SG90 draws stall current continuously and can burn out.
      TODO before mounting: verify analogWrite on pins 5/6 still drives the motors
      once Servo.h claims a hardware timer.

  - item: ESP32 dev board, 30-pin, CP2102 USB-C
    qty: 1
    source: local
    status: received
    notes: >-
      Bench-prototyping board only. Evaluated as a replacement for the Arduino
      Uno R4 Minima and REJECTED on 2026-07-25 - the R4 Minima is the committed
      co-processor, do not re-propose the swap. Used successfully to bench-test
      the Phase 5 pan-tilt servos before they moved to the R4 (GPIO 18 pan /
      GPIO 19 tilt, ESP32Servo library by Kevin Harrington - the stock Servo
      library does not compile for ESP32). Needs the esp32 core by Espressif
      installed via Boards Manager; board "ESP32 Dev Module". Enumerates on
      macOS as /dev/cu.usbserial-0001 (CP2102, driver built into macOS).
      3.3V logic and NOT 5V tolerant on any pin. Must straddle the breadboard
      centre gutter. Gotcha that cost an hour: a dead USB cable gave no power
      LED and nothing at all on the USB bus - swap the cable first.

  - item: Solder wire, rosin core (~0.8mm)
    qty: 1 roll
    source: local (Advanced M or similar)
    status: received
    notes: Bought before the DRV8871s arrived, for attaching headers/screw
      terminals if unsoldered. 60/40 leaded is easiest for a beginner;
      lead-free needs more heat. Not yet used.

  - item: Resistor assortment, 1/4W through-hole, E12 series (~100R to 10k)
    qty: 1
    source: local
    status: received
    notes: 600pcs metal film kit, 1% tolerance, 30 values (10R-1M) x 20pcs
      each, boxed and labeled. For the resistor divider that replaces the
      optocoupler on the gate-status sense line (see
      docs/decisions/0002-resistor-divider-over-optocoupler.md). Specific
      divider values still to be picked once the CP80 LED terminal is
      measured under load in Phase 3. Separate from the earlier 5-piece
      "Resistors" entry above (values TBC, 47R/10k candidates for LED and
      photo interrupter pull-ups).

  - item: DRV8871 motor driver module (Hongtu Technology replacement)
    qty: 3
    spare: 1
    source: AliExpress (Hongtu Technology, MUR 61.90/unit)
    ordered: 2026-07-29
    status: received
    notes: >-
      MOSFET replacement for L298N (near-zero voltage drop, ~25-30% speed gain,
      confirmed by DM850 test showing 1.73V lost in the L298N). Single-channel,
      so 2 in use (one per motor side) + 1 spare. Up to ~3.6A with built-in
      current limiting - ample stall headroom for 2 TT motors per board. Screw
      terminals for motor + power wires; logic via header pins.
      Gotcha: minimum supply is 6.5V, so a deeply sagged 2S pack will
      trip undervoltage lockout (recharge point). Motors stay limited to 2S
      (7.4V) - the driver tolerates more but the TT motors max out at 9V.
      Replaces the original DIY NOW 5-pack order (MUR 273.25, ordered
      2026-07-09), which arrived as the wrong item and was not usable.
      Not yet soldered/wired - solder wire on hand, not yet used.

