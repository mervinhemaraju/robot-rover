rejected:
  - item: Gamma 5005 4WD kit
    reason: Arduino-only, no WiFi/camera/Python path

  - item: Arduino Nano R4
    reason: Too new, fiddly footprint, no L298N tutorial base

  - item: Raspberry Pi Zero 2W
    reason: Pi 3B already owned and is strictly better (more RAM, pre-soldered GPIO, standard CSI ribbon)

  - item: L293D motor driver
    reason: Only 600mA/channel — insufficient for 4 TT motors under load

  - item: Generic AliExpress single-deck 4WD chassis
    reason: No encoders, too cramped for Pi 3B + Arduino + L298N + battery

  - item: UBEC 5V/3A buck converter
    reason: Output can drift to 5.35V — exceeds Pi 3B's 5.25V max input

  - item: 9V / AA battery holders (various, Advanced M)
    reason: Wrong voltage/format for 18650 cells

  - item: Illuminated rocker toggle switch
    reason: Redundant — battery holder already has a built-in switch
